<!doctype html>
<html lang="uz">
<head>

<meta name="theme-color" content="#0c5a43">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">

<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: phone-width shell; brand hero, deal rail, brand chips, sort switch, 2-column grid, 4 bottom tabs; onboarding + registration overlay */
:root{--bg:#f1f3ef;--surface:#fff;--surface2:#f3f6f1;--ink:#0d1c16;--muted:#5a6862;--line:#dfe5dd;
 --brand:#0c5a43;--brand2:#0f7a59;--brand-ink:#fff;--lime:#c8f169;--save:#0f9a63;--save-bg:#e1f5eb;--bad:#c23a32;--bad-bg:#fbe9e7;--chipsel:#0d1c16;--chipsel-ink:#fff;
 --shadow:0 1px 2px rgba(13,28,22,.05),0 10px 30px rgba(13,28,22,.08);--ui:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;--disp:'Unbounded','Onest',system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme="dark"]{--bg:#08100d;--surface:#101a16;--surface2:#16231d;--ink:#eef5f0;--muted:#a3b3ab;--line:#24352c;--brand:#0f6b4f;--brand2:#34c08f;--save:#3ad696;--save-bg:#113221;--bad:#ff8a80;--bad-bg:#3a1714;--chipsel:#c8f169;--chipsel-ink:#0d1c16;--shadow:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08100d;--surface:#101a16;--surface2:#16231d;--ink:#eef5f0;--muted:#a3b3ab;--line:#24352c;--brand:#0f6b4f;--brand2:#34c08f;--save:#3ad696;--save-bg:#113221;--bad:#ff8a80;--bad-bg:#3a1714;--chipsel:#c8f169;--chipsel-ink:#0d1c16;--shadow:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--ui);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
@media(min-width:540px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
header{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px}
.logo{font:800 21px/1 var(--disp);letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.logo i{width:28px;height:28px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:var(--lime);font:800 15px var(--disp);font-style:normal}
.sp{flex:1}
.hback{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;animation:inUp .3s var(--ease)}.hback[hidden]{display:none}
.obtop{display:flex;justify-content:space-between;align-items:center}.obback{border:0;background:rgba(255,255,255,.14);color:#fff;width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--lime);display:grid;place-items:center;font:700 13px var(--ui);border:0}
main{flex:1;padding:0 max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px;min-width:0}
h2{font:700 17px/1.25 var(--ui);margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)}.small{font-size:12.5px}
.secthead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
/* entrance animation */
.in-up{animation:inUp .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes inUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.page{animation:page .35s var(--ease) both}@keyframes page{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.press{transition:transform .15s var(--ease)}.press:active{transform:scale(.97)}
/* hero */
.greet{font:600 15px var(--ui);color:var(--muted);margin-top:2px}.greet b{color:var(--ink)}
.hero{background:var(--brand);color:#fff;border-radius:24px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;isolation:isolate}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;z-index:-1;filter:blur(30px);opacity:.55;animation:float 9s ease-in-out infinite alternate}
.hero::before{width:180px;height:180px;background:#1aa676;right:-50px;top:-60px}
.hero::after{width:140px;height:140px;background:#c8f16955;left:-40px;bottom:-60px;animation-delay:-4s}
@keyframes float{to{transform:translate(-30px,20px) scale(1.15)}}
.hero h1{font:800 26px/1.08 var(--disp);letter-spacing:-.035em;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--lime)}
.facts{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.facts span{background:rgba(255,255,255,.14);border-radius:999px;padding:4px 10px;white-space:nowrap}
.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);margin-right:6px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.search{display:flex;align-items:center;gap:8px;background:#fff;color:#0d1c16;border-radius:14px;padding:4px 12px;transition:box-shadow .2s}
.search:focus-within{box-shadow:0 0 0 3px #c8f16999}
.search input{flex:1;border:0;background:transparent;padding:11px 0;outline:none;min-width:0;color:#0d1c16}
.search svg{flex:none;color:#5a6862}
/* rail */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1*max(16px,env(safe-area-inset-left)));padding:2px max(16px,env(safe-area-inset-left)) 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.deal{flex:none;width:240px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px;text-align:left}
.deal .top{display:flex;gap:10px;align-items:center}
.deal .gap{font:800 22px/1 var(--disp);color:var(--save);letter-spacing:-.03em}
.deal .nm{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pricepair{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.pricepair div{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pricepair b{font-variant-numeric:tabular-nums}.pricepair .hi b{color:var(--muted);text-decoration:line-through;font-weight:500}
/* chips + sort */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(16px,env(safe-area-inset-left)));padding:0 max(16px,env(safe-area-inset-left))}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center;transition:background .2s,color .2s,border-color .2s}
.chips button .n{font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--ink);border-radius:999px;padding:1px 7px;min-width:22px;text-align:center}
.chips button[aria-pressed="true"]{background:var(--chipsel);color:var(--chipsel-ink);border-color:var(--chipsel)}
.chips button[aria-pressed="true"] .n{background:rgba(127,127,127,.25);color:inherit}
.controls{display:flex;gap:8px;align-items:center}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg .ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:9px;background:var(--brand);transition:transform .3s var(--ease)}
.seg[data-v="1"] .ind{transform:translateX(100%)}
.seg button{position:relative;z-index:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:700;font-size:12.5px;color:var(--muted);transition:color .25s}
.seg button[aria-pressed="true"]{color:#fff}
.toggle{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;font-weight:700;font-size:12.5px;white-space:nowrap}
.sw{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle[aria-pressed="true"] .sw{background:var(--save)}.toggle[aria-pressed="true"] .sw::after{transform:translateX(12px)}
/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:7px;text-align:left;min-width:0;position:relative}
.ph{aspect-ratio:1;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden;position:relative}
.ph img{width:86%;height:86%;object-fit:contain;opacity:0;transform:scale(.96);transition:opacity .4s,transform .4s var(--ease)}
.ph img.ok{opacity:1;transform:none}
.ph .fb{display:none;width:44px;height:44px}.ph.noimg img{display:none}.ph.noimg .fb{display:block}
.badge{position:absolute;left:6px;top:6px;background:var(--save);color:#fff;font:700 11px var(--ui);border-radius:7px;padding:3px 7px;z-index:1}
.pc .nm{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.price{font:800 16px var(--ui);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.price small{font-weight:600;font-size:11.5px;color:var(--muted);margin-left:2px}
.dots{display:flex;gap:4px;align-items:center;font-size:11.5px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.sentinel{height:40px;display:grid;place-items:center;color:var(--muted);font-size:12.5px}
.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:700;background:var(--brand);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.lime{background:var(--lime);color:#0d1c16}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.empty{text-align:center;padding:28px 10px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
/* product */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;color:var(--muted);font-weight:600}
.pimg{background:#fff;border-radius:24px;border:1px solid var(--line);aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.pimg img{width:72%;height:88%;object-fit:contain;opacity:0;transition:opacity .4s}.pimg img.ok{opacity:1}.pimg .fb{display:none;width:80px}.pimg.noimg img{display:none}.pimg.noimg .fb{display:block}
.ptitle{font:800 22px/1.15 var(--disp);letter-spacing:-.03em;margin:0;text-wrap:balance}
.bestcard{background:var(--brand);color:#fff;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:4px}
.bestcard .lbl{font-size:12.5px;font-weight:600;opacity:.85}
.bestcard .p{font:800 30px/1.1 var(--disp);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.bestcard .sv{display:inline-flex;align-self:flex-start;background:var(--lime);color:#0d1c16;border-radius:8px;padding:3px 9px;font-weight:700;font-size:13px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-direction:column;gap:6px}
.bar .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:14px}
.bar .h span:first-child{display:flex;align-items:center;gap:8px;min-width:0}
.bar .tr{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden}
.bar .fl{height:100%;border-radius:6px;transform-origin:left;animation:grow .8s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.bar .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.bar.out{opacity:.5}
.tag{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.tag.save{background:var(--save-bg);color:var(--save)}.tag.plain{background:var(--surface2);color:var(--muted)}
svg.chart{width:100%;height:auto;display:block}
svg.chart path.ln{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.2s var(--ease) forwards}@keyframes draw{to{stroke-dashoffset:0}}
.verdict{border-radius:12px;padding:10px 12px;font-weight:500;font-size:14px}.verdict.ok{background:var(--save-bg);color:var(--save)}.verdict.fake{background:var(--bad-bg);color:var(--bad)}.verdict.mid{background:var(--surface2);color:var(--muted)}
.progress{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden}.progress i{display:block;height:100%;background:var(--brand2);border-radius:4px;animation:grow 1s var(--ease) both;transform-origin:left}
.watch{display:flex;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
.field input,.field select,.watch input{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface2);font-weight:500;font-size:15px;min-width:0;width:100%}
.field input:focus,.field select:focus{outline:2px solid var(--brand2);outline-offset:0}
.old{text-decoration:line-through;color:var(--muted);font-variant-numeric:tabular-nums}
/* profile */
.prof{display:flex;gap:14px;align-items:center}
.prof .av{width:62px;height:62px;border-radius:50%;background:var(--brand);color:var(--lime);display:grid;place-items:center;font:800 22px var(--disp);flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat b{font:800 18px var(--disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.menu{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.menu button,.menu .row{display:flex;align-items:center;gap:12px;padding:14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.menu > :first-child{border-top:0}
.menu .ic{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;flex:none}
.menu .ic svg{width:18px;height:18px;stroke:var(--brand2);fill:none;stroke-width:2}
.menu .tx{flex:1;min-width:0;display:flex;flex-direction:column}.menu .tx small{color:var(--muted)}
.mini{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:3px}
.mini button{border:0;background:none;border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:700;color:var(--muted)}
.mini button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* search tab */
.findbar{display:flex;flex-direction:column;gap:10px}
.findbar .search{border:1px solid var(--line);background:var(--surface);color:var(--ink)}.findbar .search input{color:var(--ink)}
.pop{display:flex;flex-wrap:wrap;gap:8px}.pop button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;color:var(--ink)}
.tgav{width:52px;height:52px;border-radius:50%;background:#229ED9;color:#fff;display:grid;place-items:center;font:800 22px var(--disp)}

.hstats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.hstats div{background:var(--surface2);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.hstats small{color:var(--muted);font-size:11.5px;font-weight:600}.hstats b{font-variant-numeric:tabular-nums;font-size:14.5px}
.ubadge{display:inline-flex;align-self:flex-start;border-radius:8px;padding:3px 9px;font-weight:700;font-size:12.5px}
.ubadge.lo{background:var(--save-bg,#e3f6ec);color:var(--save)}.ubadge.hi{background:#fde8e6;color:var(--bad)}
.pc .ub{position:absolute;right:6px;top:6px;background:var(--save);color:#fff;font:700 10.5px var(--ui);border-radius:7px;padding:3px 6px;z-index:1}
.ctl{display:flex;flex-direction:column;gap:6px}.ctl .lab{font-size:12px;font-weight:700;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap}.pills button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-weight:700;font-size:12.5px;color:var(--ink)}
.pills button[aria-pressed="true"]{background:var(--chipsel);color:var(--chipsel-ink);border-color:var(--chipsel)}
.icalc .irow .meta b{color:var(--ink)}
.trust{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted)}.trust .ok{color:var(--save)}.trust .no{color:var(--bad)}.trust .md{color:#c58a00}
.trust .sc{font-weight:700}.trust summary{cursor:pointer;list-style:none}.trust summary::-webkit-details-marker{display:none}.trust[open]{flex-direction:column}.trust>div{padding-left:4px}
.cmpbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));z-index:8;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:8px;align-items:center}
.cmpbar[hidden]{display:none}
@media(min-width:1080px){.cmpbar{bottom:24px}}
.cmpt{overflow-x:auto;margin:0 -16px;padding:0 16px}
.cmpt table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;table-layout:fixed}
.cmpt th,.cmpt td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.cmpt th{color:var(--muted);font-weight:600;font-size:11.5px;width:78px;position:sticky;left:0;background:var(--bg);z-index:1}
.cmpt td{width:132px;word-break:break-word}.cmpt .win{color:var(--save);font-weight:700}
.cmpt .pimg{aspect-ratio:1;border-radius:14px;max-width:120px}
.aisaw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}.aisaw b{color:var(--brand2)}.aisaw span{background:var(--surface2);border-radius:999px;padding:3px 9px;font-weight:600}
.wrong{gap:8px}
.irow{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-top:1px solid var(--line)}.irow:first-of-type{border-top:0}
.irow .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:14px}.irow .h span:first-child{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.irow .meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}.irow .bad{color:var(--bad)}
.btiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btile{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:10px 8px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
.btile .bi{width:56px;height:56px;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden}.btile .bi img{width:100%;height:100%;object-fit:contain}
.btile b{font-size:13.5px}.btile small{font-size:11.5px;color:var(--muted);font-weight:600}
#chips{scroll-margin-top:80px}
.chips[hidden],.controls[hidden],#browse[hidden]{display:none!important}
.rescount{font-size:13px;color:var(--muted);font-weight:600}
.chg{display:inline-flex;align-self:flex-start;width:fit-content;align-items:center;gap:3px;font-size:11.5px;font-weight:800;border-radius:7px;padding:2px 6px;margin-top:2px}
.chg.dn{background:#1aa67626;color:#14935f}.chg.up{background:#e5484d22;color:#d93a3f}
.facts .rf{border:0;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 10px;white-space:nowrap;font:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.facts .rf svg{width:13px;height:13px}.spin svg{animation:spin .8s linear infinite}

html{overscroll-behavior-y:contain}
#ptr{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));z-index:5;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.18);display:grid;place-items:center;color:var(--brand2);transform:translateY(-70px);opacity:0;pointer-events:none}
#ptr svg{width:20px;height:20px}#ptr.go{transition:transform .25s var(--ease),opacity .25s}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:62px}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;transition:transform .25s var(--ease)}
nav button[aria-current="page"]{color:var(--brand2)}nav button[aria-current="page"] svg{transform:translateY(-2px) scale(1.08)}
nav button[aria-current="page"]::after{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--brand2)}
.cnt{position:absolute;top:8px;left:calc(50% + 6px);background:var(--save);color:#fff;font-size:10px;border-radius:8px;padding:0 5px;line-height:15px}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:14px;font-weight:600;font-size:14px;z-index:40;max-width:92vw;transform:translateX(-50%);animation:toastIn .35s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}
.toast[hidden]{display:none}
.skel{background:linear-gradient(90deg,var(--surface) 0,var(--surface2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:20px;height:200px}
@keyframes sk{to{background-position:-200% 0}}
/* onboarding */
.ob{position:fixed;inset:0;z-index:50;background:var(--brand);color:#fff;display:flex;flex-direction:column;overflow:auto}
.ob[hidden]{display:none}
.ob .wrap{max-width:480px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));gap:18px}
.ob .art{flex:1;min-height:240px;display:grid;place-items:center;position:relative}
.ob h1{font:800 30px/1.05 var(--disp);letter-spacing:-.04em;margin:0;text-wrap:balance}.ob h1 em{font-style:normal;color:var(--lime)}
.ob p{margin:0;opacity:.85;font-size:15.5px;max-width:36ch}
.steps{display:flex;gap:6px}.steps i{height:5px;width:18px;border-radius:3px;background:rgba(255,255,255,.3);transition:width .3s,background .3s}.steps i.on{width:34px;background:var(--lime)}
.ob .skip{border:0;background:none;color:#fff;opacity:.8;font-weight:600;align-self:flex-end}
.tags3{position:relative;width:250px;height:230px}
.ptag{position:absolute;background:#fff;color:#0d1c16;border-radius:14px;padding:10px 14px;font:800 18px var(--ui);box-shadow:0 12px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:bob 3s ease-in-out infinite alternate}
.ptag small{font:600 11px var(--ui);color:#5a6862}
.ptag.win{background:var(--lime)}
@keyframes bob{to{transform:translateY(-10px) rotate(-2deg)}}
.chart2{width:250px;height:170px}
.chart2 path{stroke-dasharray:500;stroke-dashoffset:500;animation:draw 2s var(--ease) forwards}
.reg{background:var(--surface);color:var(--ink);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.reg .bchips{display:flex;flex-wrap:wrap;gap:6px}
.reg .bchips button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 11px;font-weight:600;font-size:13px}
.reg .bchips button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.err{color:var(--bad);font-size:12.5px;font-weight:600}
.note{font-size:12px;color:var(--muted)}

@media(min-width:720px){
 .app{max-width:920px}

function hstats(p){const s=series(p.key),n=s.length,cur=best(p).price;if(!n)return {n:0,cur};

  const avg=Math.round(s.reduce((a,x)=>a+x.v,0)/n);const span=Math.round(ago(s[0].d))+1;
  const st=n>=7?(cur<=avg*.97?'lo':cur>=avg*1.03?'hi':'mid'):null;
  return {n,span,cur,avg,m30:win(30),m90:span>30?win(90):null,m180:span>90?win(180):null,st}}

    return {updated:d.updated,stores:d.stores,legacy:{ps,H},cats:[{id:'phones',uz:'Smartfonlar',ru:'Смартфоны',n:ps.length,img:(ps.find(p=>p.img)||{}).img}],deals:ps.filter(p=>g(p)>0).sort((a,b)=>g(b)-g(a)).slice(0,60),idx:ps.map(p=>[p.key,p.name,'phones',best(p).price,live(p).length,g(p)])}}}
function setData(m){META=m;IDX=m.idx;VER=encodeURIComponent(m.updated);const keep=Object.keys(LOADED);PM={};LOADED={};DATA={updated:m.updated,stores:m.stores,products:[]};HIST={};
  if(m.legacy){addProducts(m.legacy.ps);HIST=m.legacy.H;LOADED.phones=Promise.resolve()}addProducts(m.deals||[]);
  return ensureCats([...keep,...Object.keys(WATCH).map(catOf),S.key&&catOf(S.key),S.cat!=='all'&&S.cat])}
const watchHits=()=>{const pr=pmap();return Object.keys(WATCH).filter(k=>pr[k]&&pr[k]<=WATCH[k]).map(k=>(IDX.find(r=>r[0]===k)||[])[1]).filter(Boolean)};
getData().then(async m=>{await setData(m);const now=pmap(),seen=store.get('seenp',null);if(seen){CHG=diff(seen,now)}store.set('seenp',now);render();
  const n=Object.keys(CHG).length;const hits=watchHits();if(hits.length)toast(`${t('watchHit')} ${hits.join(', ')}`);else if(n)toast('🔔 '+t('sinceLast',{n}))}).catch(()=>{view.innerHTML=`<div class="empty">${t('loadErr')}</div>`});
let busy=false;
async function refresh(manual){if(busy||!DATA)return;busy=true;const rf=document.getElementById('rf');rf&&rf.classList.add('spin');if(manual)toast(t('refreshing'));
  try{const old=pmap();const m=await getData();await setData(m);const now=pmap();const c=diff(old,now);Object.assign(CHG,c);store.set('seenp',now);const y=scrollY;render();scrollTo(0,y);
    const n=Object.keys(c).length;if(n)toast('🔔 '+t('changed',{n}));else if(manual!=='auto')toast(t('fresh'));window.NX&&NX.ev('refresh',{changed:n})}
  catch(e){toast(t('loadErr'))}finally{busy=false}}
/* pull to refresh */
(()=>{const el=document.getElementById('ptr');let y0=null,dy=0;const TH=72;
  const ok=()=>!S.key&&(S.tab==='home'||S.tab==='find')&&ob.hidden&&scrollY<=0&&!busy;
  addEventListener('touchstart',e=>{y0=ok()?e.touches[0].clientY:null;dy=0;el.classList.remove('go')},{passive:true});
  addEventListener('touchmove',e=>{if(y0===null)return;dy=Math.max(0,(e.touches[0].clientY-y0)*.5);if(scrollY>0){y0=null;return}const k=Math.min(dy,TH*1.4);el.style.opacity=Math.min(1,k/TH);el.style.transform=`translateY(${k-50}px) rotate(${k*4}deg)`},{passive:true});
  addEventListener('touchend',async()=>{if(y0===null)return;y0=null;el.classList.add('go');if(dy>=TH){el.style.transform='translateY(30px)';el.firstElementChild.style.animation='spin .8s linear infinite';await refresh(false);el.firstElementChild.style.animation=''}el.style.transform='translateY(-70px)';el.style.opacity=0});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&DATA&&Date.now()-lastRf>15*60e3){lastRf=Date.now();refresh('auto')}})})();
let lastRf=Date.now();
render();
if(!store.get('seen',0))openOB(0);
const nxBoot=async()=>{if(USER){if(!store.get('synced',0)){const ok=await NX.saveUser(USER,WATCH,LANG);if(ok){store.set('synced',1);toast('☁️ '+t('saved'))}}return}const d=await NX.load();if(d&&d.name){USER={name:d.name,phone:d.phone,city:d.city,brands:d.brands||[],since:d.since||Date.now()};store.set('user',USER);if(d.watch){WATCH={...d.watch,...WATCH};store.set('watch',WATCH)}store.set('seen',1);if(!ob.hidden)ob.hidden=true;render()}};if(window.NX_READY)nxBoot();else addEventListener('nx-ready',nxBoot);
</script>
