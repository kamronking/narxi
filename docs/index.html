  if(S.key)return renderProduct(DATA.products.find(p=>p.key===S.key));({home:renderHome,watch:renderWatch,about:renderAbout})[S.tab]()}
function renderTabs(){const T=[['home','M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z'],['watch','M6 9a6 6 0 1 1 12 0c0 6 3 8 3 8H3s3-2 3-8M10 21a2 2 0 0 0 4 0'],['about','M12 8h.01M11 12h1v5h1M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z']];
  document.getElementById('tabs').innerHTML=T.map(([k,d])=>`<button data-t="${k}" ${S.tab===k&&!S.key?'aria-current="page"':''}><svg viewBox="0 0 24 24"><path d="${d}" stroke-linecap="round" stroke-linejoin="round"/></svg>${t(k)}</button>`).join('');
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>go(b.dataset.t))}
const updTxt=()=>{const u=new Date(DATA.updated);return u.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tashkent'})};
function pcard(p){const b=best(p),g=gapOf(p);return `<button class="pc" data-k="${esc(p.key)}">${img(p.img,'ph')}${g>0?`<span class="badge">−${mln(g)}</span>`:''}</div>
  <div class="nm">${esc(p.name)}</div><div class="price">${LANG==='ru'?`<small>${t('from')}</small> `:''}${fmt(b.price)}<small>${t('som')}</small></div>
  <div class="dots">${live(p).map(o=>`<span class="dot" style="background:${STORES[o.store].color}" title="${STORES[o.store].name}"></span>`).join('')}<span>${live(p).length} ${t('storesN')}</span>${WATCH[p.key]?' · 🔔':''}</div></button>`}
function deal(p){const b=best(p),w=worst(p);return `<button class="deal" data-k="${esc(p.key)}"><div class="top">${img(p.img,'ph','width:64px;flex:none')}</div><div style="min-width:0"><div class="gap">−${mln(gapOf(p))}</div><div class="nm">${esc(p.name)}</div></div></div>
  <div class="pricepair"><div><span><span class="dot" style="background:${STORES[b.store].color};display:inline-block;margin-right:6px"></span>${STORES[b.store].name}</span><b>${som(b.price)}</b></div><div class="hi"><span><span class="dot" style="background:${STORES[w.store].color};display:inline-block;margin-right:6px"></span>${STORES[w.store].name}</span><b>${som(w.price)}</b></div></div></button>`}
function bind(){view.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S.key=b.dataset.k;render();scrollTo(0,0)})}
function renderHome(){const P=DATA.products;const q=S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const counts={};P.forEach(p=>{const b=brandOf(p);counts[b]=(counts[b]||0)+1});
  let items=P.filter(p=>q.every(w=>(p.name+' '+p.key).toLowerCase().includes(w))&&(S.brand==='all'||brandOf(p)===S.brand)&&(!S.both||live(p).length>1));
  items.sort(S.sort==='gap'?(a,b)=>gapOf(b)-gapOf(a)||best(a).price-best(b).price:S.sort==='name'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>best(a).price-best(b).price);
  const deals=[...P].filter(p=>gapOf(p)>0&&gapOf(p)<worst(p).price*.3).sort((a,b)=>gapOf(b)-gapOf(a)).slice(0,8);
  const brands=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  view.innerHTML=`<section class="hero"><h1>${t('h1a')} <em>${t('h1b')}</em></h1>
    <div class="facts"><span class="live">${t('upd')} ${updTxt()}</span><span>${P.length} ${t('models')}</span><span>${Object.keys(DATA.stores).length} ${t('storesN')}</span></div>
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="${t('search')}" value="${esc(S.q)}" aria-label="${t('search')}"></label></section>
   ${!q.length&&deals.length?`<section style="display:flex;flex-direction:column;gap:10px"><div class="secthead"><h2>${t('biggest')}</h2><span class="small muted">${t('bigSub')}</span></div><div class="rail">${deals.map(deal).join('')}</div></section>`:''}
   <div class="chips" role="group"><button data-b="all" aria-pressed="${S.brand==='all'}">${t('all')}<small>${P.length}</small></button>${brands.map(([b,c])=>`<button data-b="${b}" aria-pressed="${S.brand===b}">${b}<small>${c}</small></button>`).join('')}</div>
   <div class="sortbar" role="group"><button data-s="cheap" aria-pressed="${S.sort==='cheap'}">${t('sortCheap')}</button><button data-s="gap" aria-pressed="${S.sort==='gap'}">${t('sortGap')}</button><button data-s="both" aria-pressed="${S.both}">${t('both')}</button></div>
   <section class="grid">${items.slice(0,S.limit).map(pcard).join('')}</section>${!items.length?`<div class="empty">${t('noRes')}</div>`:''}
   ${items.length>S.limit?`<button class="btn ghost more" id="more">${t('more')} · ${items.length-S.limit}</button>`:''}`;
  const qi=document.getElementById('q');qi.oninput=()=>{S.q=qi.value;S.limit=24;const pos=qi.selectionStart;renderHome();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)};
  view.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{S.brand=b.dataset.b;S.limit=24;renderHome()});
  view.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{if(b.dataset.s==='both')S.both=!S.both;else S.sort=b.dataset.s;S.limit=24;renderHome()});
  const m=document.getElementById('more');if(m)m.onclick=()=>{S.limit+=24;renderHome()};bind()}
function chart(p){const s=series(p.key);if(s.length<2)return '';const W=320,H=110,pt=8,pb=18;const vs=s.map(x=>x.v),mn=Math.min(...vs),mx=Math.max(...vs),sp=mx-mn||1;
  const x=i=>4+(W-8)*i/(s.length-1),y=v=>pt+(H-pt-pb)*(1-(v-mn)/sp);const d=s.map((o,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(o.v).toFixed(1)}`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('history')}"><path d="${d}L${x(s.length-1)},${H-pb}L${x(0)},${H-pb}Z" fill="var(--brand2)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--brand2)" stroke-width="2"/><circle cx="${x(s.length-1)}" cy="${y(vs[vs.length-1])}" r="4" fill="var(--brand2)"/><text x="4" y="${H-3}" font-size="10" fill="var(--muted)">${s[0].d.slice(5)}</text><text x="${W-4}" y="${H-3}" font-size="10" fill="var(--muted)" text-anchor="end">${s[s.length-1].d.slice(5)}</text></svg>`}
function renderProduct(p){if(!p){go('home');return}const b=best(p),w=worst(p),v=verdict(p),wt=WATCH[p.key];const u=url=>url+(url.includes('?')?'&':'?')+'utm_source=narxi';
  const offs=[...p.offers].sort((a,c)=>(a.stock!=='ok')-(c.stock!=='ok')||a.price-c.price);const mxp=Math.max(...offs.map(o=>o.price));
  view.innerHTML=`<button class="back" id="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>${t('back')}</button>
   ${img(p.img,'pimg')}</div><h1 class="ptitle">${esc(p.name)}</h1>
   <section class="bestcard"><span class="lbl">${t('cheapest')} · ${STORES[b.store].name}</span><span class="p">${som(b.price)}</span>${w.price>b.price?`<span class="sv">−${som(w.price-b.price)} ${t('save')}</span>`:''}</section>
   <section class="cmp"><h2>${t('cmpT')}</h2>${offs.map(o=>`<div class="bar ${o.stock==='ok'?'':'out'}"><div class="h"><span><span class="dot" style="background:${STORES[o.store].color}"></span>${STORES[o.store].name}${o===b?' <span class="tag save">✓</span>':''}</span><span class="price">${fmt(o.price)}</span></div>
     <div class="tr"><div class="fl" style="width:${Math.max(8,o.price/mxp*100)}%;background:${o===b?'var(--save)':STORES[o.store].color}"></div></div>
     <div class="meta"><span>${o.stock==='ok'?t('inStock'):t('out')}${o.inst?` · ${t('inst')} ${fmt(o.inst)} ${t('perMo')}`:''}${o.old?` · <span class="old">${fmt(o.old)}</span>`:''}</span>${o.url?`<a class="btn sm ghost" href="${esc(u(o.url))}" target="_blank" rel="noopener">${t('open')} ↗</a>`:''}</div></div>`).join('')}</section>
   <section class="box"><h2>${t('history')}</h2>${chart(p)}${v.n!==undefined?`<div class="progress"><i style="width:${Math.min(100,v.n/7*100)}%"></i></div>`:''}<div class="verdict ${v.cls}">${v.txt}</div></section>
   <section class="box"><span class="small muted">${t('watchT')}</span><div class="watch"><input id="wv" inputmode="numeric" placeholder="${t('watchPh')}" value="${fmt(wt||Math.round(b.price*.95/1000)*1000)}" aria-label="${t('watchPh')}"><button class="btn sm" id="wb">${wt?t('watching'):t('watchBtn')}</button></div></section>`;
  document.getElementById('back').onclick=()=>go(S.tab);
  document.getElementById('wb').onclick=()=>{const val=parseInt(document.getElementById('wv').value.replace(/\D/g,''),10);if(!val)return;WATCH[p.key]=val;store.set('watch',WATCH);toast(t('watchSet'));renderProduct(p)}}
function renderWatch(){const ks=Object.keys(WATCH).filter(k=>DATA.products.find(p=>p.key===k));
  view.innerHTML=`<h1 class="ptitle">${t('watch')}</h1>${ks.length?`<div class="grid">${ks.map(k=>{const p=DATA.products.find(x=>x.key===k),hit=best(p).price<=WATCH[k];return `<div style="display:flex;flex-direction:column;gap:6px">${pcard(p)}<div class="small">${t('watchPh')}: <b>${fmt(WATCH[k])}</b> ${hit?`<span class="tag save">${t('reached')}</span>`:''}</div><button class="btn ghost sm" data-rm="${esc(k)}">${t('remove')}</button></div>`}).join('')}</div>`:`<div class="empty">${t('wEmpty')}</div>`}`;
  bind();view.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{delete WATCH[b.dataset.rm];store.set('watch',WATCH);renderWatch()})}
function renderAbout(){view.innerHTML=`<h1 class="ptitle">${t('aboutT')}</h1><section class="box about"><p>${t('a1')}</p><p>${t('a2')}</p><p>${t('a3')}</p></section>
  <section class="box"><div class="stores">${Object.entries(DATA.stores).map(([s,v])=>`<div><span><span class="dot" style="background:${STORES[s].color};display:inline-block;margin-right:8px"></span><b>${STORES[s].name}</b></span><span class="tag save">${t('connected')} · ${v.items}</span></div>`).join('')}${SOON.map(s=>`<div><span class="muted">${s}</span><span class="tag plain">${t('soon')}</span></div>`).join('')}</div></section>
  <p class="small muted" style="margin:0">${t('a5')}</p>`}
document.getElementById('lang').onclick=()=>{LANG=LANG==='uz'?'ru':'uz';store.set('lang',LANG);render()};
Promise.all([fetch('data/latest.json',{cache:'no-cache'}).then(r=>r.json()),fetch('data/history.json',{cache:'no-cache'}).then(r=>r.json()).catch(()=>({}))]).then(([d,h])=>{DATA=d;HIST=h;DATA.products=DATA.products.filter(p=>live(p).length);render();
  const hits=Object.keys(WATCH).map(k=>DATA.products.find(p=>p.key===k)).filter(p=>p&&best(p).price<=WATCH[p.key]);if(hits.length)toast(`${t('watchHit')} ${hits.map(p=>p.name).join(', ')}`)}).catch(()=>{view.innerHTML=`<div class="empty">${t('loadErr')}</div>`});
render();
</script>
