name: telegram bot
on:
  schedule:
    - cron: '*/5 * * * *'   # read new bot messages (GitHub may delay scheduled runs)
  workflow_run:
    workflows: ['collect prices']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests firebase-admin
      - run: python scraper/bot.py ${{ github.event_name == 'workflow_run' && 'notify' || '' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
