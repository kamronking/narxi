name: probe
on:
  push:
    branches: [probe]
    paths: ['probe/urls.json']
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python probe/dl.py
      - run: |
          git config user.name narxi-bot; git config user.email narxi-bot@users.noreply.github.com
          git add probe/img && git commit -qm "probe imgs" && git push -q origin HEAD:probe
