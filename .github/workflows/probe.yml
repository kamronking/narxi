name: probe
on:
  push:
    paths: ['scraper/probe.py','.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python scraper/probe.py
      - run: |
          git config user.name "narxi-bot"; git config user.email "bot@users.noreply.github.com"
          git add probe_out probe_out2; git commit -m "probe results" || true; git push
