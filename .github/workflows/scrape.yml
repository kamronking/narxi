name: collect prices
on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  push:
    paths: ['scraper/scrape.py', '.github/workflows/scrape.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python scraper/scrape.py
      - run: |
          git config user.name "narxi-bot"
          git config user.email "narxi-bot@users.noreply.github.com"
          git add docs/data
          git commit -m "prices $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
