name: collect prices
on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  push:
    paths: ['scraper/scrape.py', '.github/workflows/scrape.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python scraper/scrape.py
      - run: |
          git config user.name "narxi-bot"
          git config user.email "narxi-bot@users.noreply.github.com"
          # keep this run's data, put it on top of the latest main (code may have changed meanwhile)
          cp -r docs/data /tmp/newdata
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            rm -rf docs/data && cp -r /tmp/newdata docs/data
            git add -A docs/data
            git commit -q -m "prices $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
